<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SAV 3GCOM</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-512.png">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<style>
body{font-family:system-ui,sans-serif;background:#f5f5f5;margin:0;padding:10px;padding-bottom:80px}
#header{background:#111;color:#fff;padding:16px;border-radius:14px;text-align:center;margin-bottom:12px;font-weight:bold;font-size:20px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px #0001;position:relative;overflow:hidden;transition:opacity .3s}
.big{font-size:20px;font-weight:900}
.btn{width:48%;padding:16px 0;border-radius:12px;border:0;font-size:17px;font-weight:bold;margin-top:10px;cursor:pointer}
.call{background:#e8f5e9;color:#2e7d32}.maps{background:#e3f2fd;color:#1565c0}
.done{background:#2e7d32;color:#fff;width:100%}.inj{background:#c62828;color:#fff;width:100%;margin-top:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.motif{padding:18px;border-radius:12px;background:#fff3e0;border:2px solid #ffe0b2;text-align:center;font-weight:bold;font-size:16px;cursor:pointer}
#debug{background:#fffbe6;padding:10px;border-radius:8px;font-size:12px;margin-bottom:10px;border:1px solid #ffe58f;word-break:break-all}
#subBtn{background:#ff6f00;color:#fff;padding:14px;border-radius:12px;width:100%;border:0;font-weight:bold;display:none;margin-bottom:10px;cursor:pointer}
#installBtn{background:#111;color:#fff;padding:14px;border-radius:12px;width:100%;border:0;font-weight:bold;display:none;margin-bottom:10px;cursor:pointer}
.card.urgent{border-left:6px solid #c62828;background:#fff5f5;box-shadow:0 3px 12px #c6282833}
.card.urgent .big{color:#c62828}
.badge-urgent{background:#c62828;color:#fff;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:900;position:absolute;top:10px;right:10px;animation:pulse 1.5s infinite}
.badge-normal{background:#e0e0e0;color:#666;padding:4px 8px;border-radius:20px;font-size:11px;position:absolute;top:10px;right:10px}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
.prio-stripe{position:absolute;left:0;top:0;bottom:0;width:6px;background:#c62828}
.card.flash{outline:4px solid #ff6f00;animation:flashbg 1s 3}
@keyframes flashbg{50%{background:#fff3e0}}
.small{color:#888;font-size:13px}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 22px;border-radius:24px;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:opacity .3s;max-width:90%;text-align:center}
#toast.show{opacity:1}
#confirmBar{position:fixed;bottom:0;left:0;right:0;background:#2e7d32;color:#fff;padding:14px 16px;box-shadow:0 -4px 16px #0003;z-index:100;display:none;align-items:center;gap:10px}
#confirmBar.show{display:flex}
#confirmBar .txt{flex:1;font-weight:bold;font-size:15px}
#confirmBar button{background:#fff;color:#2e7d32;border:0;border-radius:10px;padding:14px 18px;font-weight:900;font-size:16px;cursor:pointer}
#confirmBar .cancel{background:#00000033;color:#fff}
</style>
</head><body>
<div id="header">🔧 SAV - <span id="techName">...</span><br><small id="count"></small><br><small id="prioCount" style="font-size:12px"></small></div>
<div id="debug">Init OneSignal...</div>
<button id="installBtn" onclick="installApp()">📲 INSTALLER L'APP SUR L'ÉCRAN D'ACCUEIL</button>
<button id="subBtn" onclick="forceSubscribe()">🔔 ACTIVER NOTIFICATIONS</button>
<div id="list">Chargement jobs...</div>
<button onclick="testPushNow()" style="width:100%;padding:18px;background:#111;color:#fff;border-radius:14px;margin-top:20px;font-weight:bold;font-size:18px;cursor:pointer">🔔 TEST PUSH NOW</button>
<div style="text-align:center;margin-top:10px"><a href="#" onclick="loadJobs();return false;" style="color:#666">🔄 Refresh</a> | <a href="#" onclick="testReminder();return false;" style="color:#c62828">⏰ Test Rappel</a></div>
<div id="toast"></div>
<div id="confirmBar"><div class="txt" id="confirmTxt"></div><button onclick="confirmMotifGo()">CONFIRMER</button><button class="cancel" onclick="hideConfirm()">✖</button></div>
<script>
const EXEC_URL = "https://script.google.com/macros/s/AKfycbwZ83WxyGhYKAgu0L41fPJSCNLm0FXVxHgb7CYWRegP2DkehQsW5ecJmF_4BSVjASVm/exec";
const ONESIGNAL_APP_ID = "ba944959-097a-43c3-83c6-245d23f232d3";

// Tech mémorisé pour toujours (1ère visite avec ?tech=xxx verrouille, même depuis l'icône home)
const params = new URLSearchParams(location.search);
const TECH = (params.get('tech') || localStorage.getItem('savTech') || 'nazih').toLowerCase();
localStorage.setItem('savTech', TECH);
const FOCUS_JOB = params.get('job') || '';
const FOCUS_MOTIF = params.get('motif') || '';
document.getElementById('techName').innerText = TECH;

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./OneSignalSDKWorker.js').catch(() => {}));
}

/* ---------- OneSignal ---------- */
window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function(OneSignal){
  try{
    await OneSignal.init({appId: ONESIGNAL_APP_ID, notifyButton: {enable:true}});
    var checkSub = async () => {
      var id = OneSignal.User.PushSubscription.id || "no-id";
      var opted = OneSignal.User.PushSubscription.optedIn;
      var perm = OneSignal.Notifications.permission;
      document.getElementById('debug').innerText = "Sub:"+id.substring(0,8)+" opted:"+opted+" perm:"+perm+" tag:"+TECH;
      if(!opted || perm===false){
        document.getElementById('subBtn').style.display='block';
      } else {
        await OneSignal.User.addTag("tech", TECH);
        document.getElementById('subBtn').style.display='none';
      }
    };
    await checkSub();
    OneSignal.User.PushSubscription.addEventListener("change", checkSub);
    OneSignal.Notifications.addEventListener("permissionChange", checkSub);
  }catch(e){
    document.getElementById('debug').innerText = "OneSignal init error: "+e;
  }
});

async function forceSubscribe(){
  window.OneSignalDeferred.push(async function(OneSignal){
    try{
      await OneSignal.Notifications.requestPermission();
      await OneSignal.User.PushSubscription.optIn();
      await OneSignal.User.addTag("tech", TECH);
      toast("🔔 Notifications activées!");
      setTimeout(()=>location.reload(),800);
    }catch(e){alert("Erreur: "+e);}
  });
}

/* ---------- Install as app ---------- */
var deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e;
  document.getElementById('installBtn').style.display = 'block';
});
function installApp(){
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt = null;
  document.getElementById('installBtn').style.display = 'none';
}
window.addEventListener('appinstalled', () => toast('📲 App installée!'));

/* ---------- Helpers ---------- */
var toastTimer = null;
function toast(msg){
  var t = document.getElementById('toast');
  t.innerText = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
function jsonp(action, data, cb){
  var cbName = 'cb_' + Math.random().toString(36).slice(2);
  window[cbName] = function(res){ delete window[cbName]; cb(res); };
  var qs = Object.keys(data).map(k => k + '=' + encodeURIComponent(data[k])).join('&');
  var s = document.createElement('script');
  s.src = EXEC_URL + '?action=' + action + '&' + qs + '&callback=' + cbName + '&t=' + Date.now();
  s.onerror = function(){ toast('❌ Erreur réseau — recharge'); };
  document.body.appendChild(s);
}
function telCleanOf(t){
  var t = String(t||'').replace(/[^0-9+]/g,'');
  if(t.indexOf('+212')===0) t='0'+t.substring(4);
  if(t.indexOf('212')===0 && t.length>=12) t='0'+t.substring(3);
  if(/^[67]\d{8}$/.test(t)) t='0'+t;
  return t;
}

/* ---------- Jobs list ---------- */
function onJobs(jobs){
  if(!Array.isArray(jobs)){
    document.getElementById('list').innerHTML = "<div class='card' style='color:red'>❌ Erreur de chargement<br><small>Vérifie Code.gs + déploiement Apps Script</small></div>";
    return;
  }
  jobs.sort((a,b) => (b.priority||0) - (a.priority||0));
  var urgent = jobs.filter(j => j.priority == 1).length;
  var normal = jobs.length - urgent;
  document.getElementById('count').innerText = jobs.length + " jobs à faire";
  document.getElementById('prioCount').innerHTML = urgent>0 ? "🔴 <b style='color:#ff8a80'>"+urgent+" URGENT</b> | ⚪ "+normal+" normaux" : normal+" normaux";
  var html = "";
  jobs.forEach(j => {
    var isUrgent = j.priority == 1;
    var badge = isUrgent ? '<div class="badge-urgent">🚩 URGENT P1</div><div class="prio-stripe"></div>' : '<div class="badge-normal">P0 normal</div>';
    var telClean = telCleanOf(j.tel);
    var telLink = "tel:" + telClean;
    var mapsLink = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(j.adresse||"");
    var wazeLink = "https://waze.com/ul?q=" + encodeURIComponent(j.adresse||"");
    html += '<div class="card'+(isUrgent?' urgent':'')+'" id="card-'+j.id+'">'+badge
      +'<div class="big">'+(isUrgent?'🔴 ':'')+j.id+'</div>'
      +'<div>👤 '+j.client+'</div>'
      +'<div>📍 '+j.adresse+'</div>'
      +'<div>📞 <a href="'+telLink+'" style="color:#1565c0;font-weight:bold">'+telClean+'</a> '+(telClean!=j.tel?'<small style="color:#888">(corrigé)</small>':'')+'</div>'
      +'<div style="display:flex;justify-content:space-between"><a href="'+telLink+'" style="width:48%;text-decoration:none"><button class="btn call" style="width:100%">📞 APPELER</button></a><a href="'+mapsLink+'" target="_blank" style="width:48%;text-decoration:none"><button class="btn maps" style="width:100%">🗺️ MAPS</button></a></div>'
      +'<div style="display:flex;margin-top:6px"><a href="'+wazeLink+'" target="_blank" style="width:100%;text-decoration:none"><button class="btn" style="width:100%;background:#e0f7fa;color:#006064">🚗 WAZE</button></a></div>'
      +'<button class="btn done" onclick="showMotifs(\''+j.id+'\')">✅ FAIT</button>'
      +'<button class="btn inj" onclick="doUpdate(\''+j.id+'\',\'Injoignable\',\'\')">❌ INJOIGNABLE</button>'
      +'<div id="motifs-'+j.id+'" style="display:none" class="grid">'
      +['PCO','PTO','Splitter','Cable','Jartiere','Config'].map(m=>'<div class="motif" onclick="doUpdate(\''+j.id+'\',\'Fait\',\''+m+'\')">'+m+'</div>').join('')
      +'</div></div>';
  });
  if(!jobs.length) html = "<div class='card'>Aucun job ✅ — Bonne journée!</div>";
  document.getElementById('list').innerHTML = html;

  // Deep link depuis la notification
  if(FOCUS_JOB){
    var el = document.getElementById('card-'+FOCUS_JOB);
    if(el){
      el.scrollIntoView({behavior:'smooth', block:'center'});
      el.classList.add('flash');
      if(!FOCUS_MOTIF){
        var mg = document.getElementById('motifs-'+FOCUS_JOB);
        if(mg) mg.style.display = 'grid';
      }
    }
  }
  // Bouton ✅PCO/✅PTO de la notification → barre de confirmation verte
  if(FOCUS_JOB && FOCUS_MOTIF){
    var found = jobs.some(j => String(j.id).trim() == FOCUS_JOB);
    if(found) showConfirm(FOCUS_JOB, FOCUS_MOTIF);
    else toast('ℹ️ '+FOCUS_JOB+' déjà traité');
  }
}

function loadJobs(){ jsonp('getJobs', {tech: TECH}, onJobs); }

function showMotifs(id){
  var e = document.getElementById('motifs-'+id);
  e.style.display = e.style.display == 'none' ? 'grid' : 'none';
}

/* Plus aucun confirm() — 2 taps max */
function doUpdate(id, statut, motif){
  toast('⏳ ' + (motif || statut) + ' — ' + id + '...');
  var card = document.getElementById('card-'+id);
  if(card) card.style.opacity = '0.4';
  jsonp('updateJob', {id: id, statut: statut, motif: motif || ''}, function(r){
    if(r && r.error){ toast('❌ ' + r.error); if(card) card.style.opacity = '1'; return; }
    toast('✅ ' + id + ' → ' + statut + (motif ? ' / ' + motif : ''));
    setTimeout(loadJobs, 1000);
  });
}

/* Barre de confirmation (boutons de notification) */
function showConfirm(id, motif){
  document.getElementById('confirmTxt').innerText = '✅ ' + motif + ' sur ' + id + ' ?';
  document.getElementById('confirmBar').classList.add('show');
}
function hideConfirm(){ document.getElementById('confirmBar').classList.remove('show'); }
function confirmMotifGo(){ hideConfirm(); doUpdate(FOCUS_JOB, 'Fait', FOCUS_MOTIF); }

function testPushNow(){
  document.getElementById('debug').innerText = "Envoi push...";
  jsonp('pushTest', {tech: TECH}, function(r){
    var txt = JSON.stringify(r);
    document.getElementById('debug').innerText = txt.substring(0, 600);
    alert(txt.substring(0, 1000));
  });
}
function testReminder(){
  document.getElementById('debug').innerText = "Test rappel...";
  jsonp('remindNow', {tech: TECH}, function(r){
    var txt = JSON.stringify(r);
    document.getElementById('debug').innerText = txt.substring(0, 600);
    toast('⏰ Rappel envoyé à ' + TECH);
  });
}

loadJobs();
setInterval(loadJobs, 30000);
</script>
</body></html>
